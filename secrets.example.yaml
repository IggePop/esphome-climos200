# Vorlage: Einträge in die eigene secrets.yaml übernehmen und Werte ersetzen.
# Die echte secrets.yaml gehört nicht ins Repository (siehe .gitignore).

ota_password: "ota-passwort"
kwl_web_password: "webserver-passwort"   # Webserver-Login, Benutzer "admin"

mqtt_broker: "192.0.2.10"                # IP oder Name des MQTT-Brokers
mqtt_username: "benutzer"
mqtt_password: "mqtt-passwort"

