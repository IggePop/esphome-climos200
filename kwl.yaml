      "7.0", "7.5", "8.0", "8.5", "9.0", "9.5", "10.0", "10.5", "11.0", "11.5", "12.0", "12.5",
      "13.0", "13.5", "14.0", "14.5", "15.0", "15.5", "16.0", "16.5", "17.0", "17.5", "18.0"
    ]
    lambda: |-
      const float v = id(sommer_hysterese).state;
      if (std::isnan(v))
        return {};
