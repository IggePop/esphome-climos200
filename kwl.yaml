# Für Home Assistant einkommentieren (hier wird ESPHome ohne Home Assistant über MQTT betrieben).
#api:
#  encryption:
#    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Webserver mit Login, sonst ließen sich "Senden aktiv" und die Einstellungen ohne
# Anmeldung bedienen. Digest: das Passwort geht nicht im Klartext übers Netz (Inhalt schon).
web_server:
  port: 80
  # Version 3 mit Gruppen. Diese Seite ist die Wartungsoberfläche, das Dashboard für den Alltag
  # kommt über ioBroker (MQTT).
  version: 3
  # Knöpfe "Log kopieren" / "Log leeren" unten rechts: liest den Log-Stream mit (letzte 2000 Zeilen)
  # und kopiert ihn in die Zwischenablage, auch ohne HTTPS
  js_include: "components/climos/web/log_copy.js"
  sorting_groups:
    - id: grp_betrieb
