# ESPHome-Konfiguration für eine KWL Zehnder/Paul Climos (F) 200 am RS485-Bus des Bedienteils.
# Board: Olimex ESP32-PoE-ISO (Ethernet), Bus-Adapter: Waveshare RS485 mit automatischer
# Richtungsumschaltung. Protokoll und Verdrahtung: siehe README.md und docs/ im Repository.
#
# Benötigte Einträge in secrets.yaml (Vorlage: secrets.example.yaml):
#   ota_password, kwl_web_password, mqtt_broker, mqtt_username, mqtt_password
#   (api_encryption_key nur, wenn der api-Block unten für Home Assistant aktiviert wird)

esphome:
  name: kwl
  friendly_name: KWL

external_components:
  - source:
      type: local
      path: components
    components: [climos]

esp32:
  board: esp32-poe-iso
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf


logger:
  level: DEBUG
  initial_level: INFO

select:
  - platform: logger
    name: "Log-Level"

  # Betriebsart setzen. Zeigt die laufende Betriebsart (Objekt 0x28) und sendet bei Auswahl im
  # nächsten Fenster nach 01 FF 84 00 (bis ~9 s), nur wenn "Senden aktiv" an ist. Kein Senden
  # beim Start. Ergebnis im Sensor "Letztes Senden" (bestätigt = 0x29 vom Lüftergerät oder
  # 0x28 vom Bedienteil mit dem neuen Code innerhalb 3 s, sonst bis zu 2 Wiederholungen).
  # Reihenfolge = Code 1..6, Namen wie im Sensor "Betriebsart".
  - platform: template
    name: "Betriebsart setzen"
    icon: mdi:fan
    update_interval: 1s
    options:
      - "Stufe 1"
      - "Stufe 2"
      - "Stufe 3"
      - "Stoßlüftung"
      - "Abwesend"
      - "Automatik"
    lambda: |-
      if (!id(betriebsart).has_state())
        return {};
      const std::string &s = id(betriebsart).state;
      if (s.rfind("Code", 0) == 0)
        return {};
      return s;
    set_action:
      - lambda: |-
          static const char *const NAMES[] = {"Stufe 1", "Stufe 2", "Stufe 3", "Stoßlüftung", "Abwesend", "Automatik"};
          for (uint8_t i = 0; i < 6; i++) {
            if (x == NAMES[i]) {
              id(kwl_bus).send_operating_mode(i + 1);
              return;
            }
          }

  # Frostschutz-Art (0x7B) wie am Bedienteil, Übernahme erst nach Quittung des Lüftergeräts
  - platform: template
    name: "Frostschutz-Art setzen"
    icon: mdi:snowflake-thermometer
    update_interval: 5s
    options:
      - "eco"
      - "sicher"
      - "Feuchte-WT"
    lambda: |-
      if (!id(frostschutz_art).has_state())
        return {};
      const std::string &s = id(frostschutz_art).state;
      if (s.rfind("Code", 0) == 0)
        return {};
      return s;
    set_action:
      - lambda: |-
          static const char *const NAMES[] = {"eco", "sicher", "Feuchte-WT"};
          for (uint8_t i = 0; i < 3; i++) {
            if (x == NAMES[i]) {
              id(kwl_bus).send_frost_mode(i);
              return;
            }
          }

# Einstellwerte. Zeigen den Wert vom Bus, senden nur bei Eingabe. Kein Gerät meldet Einstellwerte
# zurück (auch nicht bei Änderung am Bedienteil). Ergebnis in "Letztes Senden": "angenommen
# (Lüftergerät)" = das Lüftergerät hat den Empfang quittiert (86/87), erst dann übernimmt der
# Sensor den Wert. Quittiert nur das Bedienteil, wird wiederholt (max. 3 Versuche).
number:
  - platform: template
    name: "Sommerlüftung Schwelle setzen"
    state_topic: kwl/number/sommerlueftung_schwelle_setzen/state
    command_topic: kwl/number/sommerlueftung_schwelle_setzen/command
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: "°C"
    min_value: 18
    max_value: 30
    step: 0.5
    mode: box
    update_interval: 5s
    lambda: |-
      const float v = id(t_som).state;
      if (std::isnan(v))
        return {};
      return v;
    set_action:
      - lambda: id(kwl_bus).send_summer_threshold(x);

  # Bereich und Schritt wie am Bedienteil: 15..120 min in 5er-Schritten
  - platform: template
    name: "Dauer Stoßlüftung setzen"
    state_topic: kwl/number/dauer_stosslueftung_setzen/state
    command_topic: kwl/number/dauer_stosslueftung_setzen/command
    icon: mdi:timer-cog-outline
    unit_of_measurement: "min"
    min_value: 15
    max_value: 120
    step: 5
    mode: box
    update_interval: 5s
    lambda: |-
      const float v = id(dauer_stoss).state;
      if (std::isnan(v))
        return {};
      return v;
    set_action:
      - lambda: id(kwl_bus).send_boost_duration(x);

  # Leistung Stufe 1 und 3 wie am Bedienteil: 17..100 % in 1-%-Schritten (Stufe 2 ist fest 60 %)
  - platform: template
    name: "Stufe 1 Leistung setzen"
    icon: mdi:fan-speed-1
    unit_of_measurement: "%"
    min_value: 17
    max_value: 100
    step: 1
    mode: box
    update_interval: 5s
    lambda: |-
      const float v = id(stufe1_leistung).state;
      if (std::isnan(v))
        return {};
      return v;
    set_action:
      - lambda: id(kwl_bus).send_stage_percent(1, x);
  - platform: template
    name: "Stufe 3 Leistung setzen"
    icon: mdi:fan-speed-3
    unit_of_measurement: "%"
    min_value: 17
    max_value: 100
    step: 1
    mode: box
    update_interval: 5s
    lambda: |-
      const float v = id(stufe3_leistung).state;
      if (std::isnan(v))
        return {};
      return v;
    set_action:
      - lambda: id(kwl_bus).send_stage_percent(3, x);

# Wochenprogramm setzen: je Tag oder als Gruppe Mo-Fr bzw. Sa-So (alle Tage der Gruppe gleich).
# Format wie in der Anzeige: "00:00 Stufe 1, 07:00 Stufe 2, 20:00 Stufe 1", Zeiten in Viertelstunden,
# erster Eintrag 00:00, Stufen "aus" und "Stufe 1".."Stufe 3". Ungültige Eingaben werden abgelehnt
# (Grund in "Letztes Senden"). Gesendet werden nur die Register der gewählten Tage, höchstens 6 je
# Frame wie vom Bedienteil (Mo-Fr 3 Frames, Sa-So 1, ein Tag 1), je Sendefenster eins (Mo-Fr ~20 s).
# Jedes Frame muss das Lüftergerät quittieren, sonst bis zu 3 Versuche je Frame.
# Die Gruppen zeigen den ersten Tag (Mo-Fr den Montag, Sa-So den Samstag). Tagesmaske: Bit 0 = Mo.
text:
  - platform: template
    name: "Wochenprogramm Mo-Fr setzen"
    icon: mdi:calendar-edit
    mode: text
    max_length: 255
    update_interval: 5s
    lambda: |-
      if (!id(wp_montag).has_state())
        return {};
      return id(wp_montag).state;
    set_action:
      - lambda: id(kwl_bus).send_schedule(0x1F, x);
  - platform: template
    name: "Wochenprogramm Sa-So setzen"
    icon: mdi:calendar-edit
    mode: text
    max_length: 255
    update_interval: 5s
    lambda: |-
      if (!id(wp_samstag).has_state())
        return {};
      return id(wp_samstag).state;
    set_action:
      - lambda: id(kwl_bus).send_schedule(0x60, x);
  - platform: template
    name: "Wochenprogramm Montag setzen"
    icon: mdi:calendar-edit
    mode: text
    max_length: 255
    update_interval: 5s
    lambda: |-
      if (!id(wp_montag).has_state())
        return {};
      return id(wp_montag).state;
    set_action:
      - lambda: id(kwl_bus).send_schedule(0x01, x);
  - platform: template
    name: "Wochenprogramm Dienstag setzen"
    icon: mdi:calendar-edit
    mode: text
    max_length: 255
    update_interval: 5s
    lambda: |-
      if (!id(wp_dienstag).has_state())
        return {};
      return id(wp_dienstag).state;
    set_action:
      - lambda: id(kwl_bus).send_schedule(0x02, x);
  - platform: template
    name: "Wochenprogramm Mittwoch setzen"
    icon: mdi:calendar-edit
    mode: text
    max_length: 255
    update_interval: 5s
    lambda: |-
      if (!id(wp_mittwoch).has_state())
        return {};
      return id(wp_mittwoch).state;
    set_action:
      - lambda: id(kwl_bus).send_schedule(0x04, x);
  - platform: template
    name: "Wochenprogramm Donnerstag setzen"
    icon: mdi:calendar-edit
    mode: text
    max_length: 255
    update_interval: 5s
    lambda: |-
      if (!id(wp_donnerstag).has_state())
        return {};
      return id(wp_donnerstag).state;
    set_action:
      - lambda: id(kwl_bus).send_schedule(0x08, x);
  - platform: template
    name: "Wochenprogramm Freitag setzen"
    icon: mdi:calendar-edit
    mode: text
    max_length: 255
    update_interval: 5s
    lambda: |-
      if (!id(wp_freitag).has_state())
        return {};
      return id(wp_freitag).state;
    set_action:
      - lambda: id(kwl_bus).send_schedule(0x10, x);
  - platform: template
    name: "Wochenprogramm Samstag setzen"
    icon: mdi:calendar-edit
    mode: text
    max_length: 255
    update_interval: 5s
    lambda: |-
      if (!id(wp_samstag).has_state())
        return {};
      return id(wp_samstag).state;
    set_action:
      - lambda: id(kwl_bus).send_schedule(0x20, x);
  - platform: template
    name: "Wochenprogramm Sonntag setzen"
    icon: mdi:calendar-edit
    mode: text
    max_length: 255
    update_interval: 5s
    lambda: |-
      if (!id(wp_sonntag).has_state())
        return {};
      return id(wp_sonntag).state;
    set_action:
      - lambda: id(kwl_bus).send_schedule(0x40, x);

# Für Home Assistant einkommentieren (hier wird ESPHome ohne Home Assistant über MQTT betrieben).
#api:
#  encryption:
#    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Webserver mit Login, sonst ließen sich "Senden aktiv" und die Einstellungen ohne
# Anmeldung bedienen. Digest: das Passwort geht nicht im Klartext übers Netz (Inhalt schon).
web_server:
  port: 80
  auth:
    type: digest
    username: admin
    password: !secret kwl_web_password

# Umlaute in Namen werden im Topic zu "_" (aus "Außenluft" wird "au__enluft");
# betroffene Entitäten haben deshalb ein eigenes state_topic.
# Broker mit Login verwenden: über MQTT lassen sich "Senden aktiv" und die Einstellungen
# bedienen, ein anonymer Broker würde das jedem Client im Netz erlauben.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  
ethernet:
  clk:
    mode: CLK_OUT
    pin: GPIO17
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  phy_addr: 0
  power_pin:
    ignore_strapping_warning: true
    number: GPIO12
  type: LAN8720

# Hardware-UART2 mit freien Olimex-Pins
# (GPIO35 ist perfekt als RX-Pin geeignet)
uart:
  id: uart_rs485
  # Verdrahtung: RXD des Waveshare-Adapters -> GPIO4, TXD des Adapters -> GPIO35.
  # Nur Empfang: GPIO4 gehört dem RMT-Sender (climos tx_pin), der UART kann das 9. Bit nicht.
  # GPIO4 braucht einen 10-kΩ-Pull-up nach 3,3 V, damit der Adapter beim Booten nicht sendet.
  rx_pin: GPIO35
  baud_rate: 9600
  stop_bits: 1

climos:
  id: kwl_bus
  uart_id: uart_rs485
  # Sender über RMT. Sendet an der laufenden KWL im Fenster 15-40 ms nach 01 FF 84 00
  # (dort antwortet niemand, danach ~160 ms Stille), ohne Busverkehr (Testsegment) sofort.
  # Nur wenn "Senden aktiv" an ist. Zum Abschalten des Senders diese Zeile auskommentieren.
  # Sendetest 9. Bit: zusätzlich bit_capture_pin auf GPIO4, beide mit allow_other_uses: true
  # (das Waveshare-Modul gibt das eigene Senden nicht auf RXD zurück).
  tx_pin: GPIO4
  # Ergebnis der letzten Umschaltung: vorgemerkt / gesendet (Versuch n) / bestätigt /
  # angenommen (Lüftergerät) / nur vom Bedienteil quittiert / keine Bestätigung /
  # kein Sendefenster / gesperrt / ungültig
  send_status:
    name: "Letztes Senden"
  # Frostschutz-Art: eco / sicher / Feuchte-WT (im Flash gehalten)
  frost_mode:
    id: frostschutz_art
    name: "Frostschutz-Art"
  # Datum und Uhrzeit der Anlage aus dem Zeit-Frame des Masters (alle 5 s), z.B. "Mi 25.11.2026 20:34"
  panel_clock:
    name: "Uhr der Anlage"
  # Zuordnung abgeleitet aus Wärmerückgewinnung (~80 %) bei geschlossenem Bypass
  temperature_81:
    id: t_zuluft
    name: "Temperatur Zuluft"
  temperature_82:
    id: t_aussenluft
    name: "Temperatur Außenluft"
    state_topic: kwl/sensor/temperatur_aussenluft/state
  temperature_83:
    id: t_abluft
    name: "Temperatur Abluft"
  temperature_84:
    name: "Temperatur Fortluft"
  # Gefahrene Stufe (in Automatik die vom Programm gewählte), wird im Flash gehalten
  fan_stage:
    name: "Lüfterstufe"
    state_topic: kwl/text_sensor/luefterstufe/state
  filter_remaining:
    name: "Filter-Restlaufzeit"
  filter_interval:
    name: "Filter-Intervall"
  operating_mode:
    id: betriebsart
    name: "Betriebsart"
  operating_hours:
    name: "Betriebsstunden insgesamt"
  fan_operating_hours:
    name: "Betriebsstunden Lüfter"
    state_topic: kwl/sensor/betriebsstunden_luefter/state
  system_on:
    name: "Anlage an"
  # Läuft gerade (Status 0x1A Bit 5), nicht der Haken im Bedienteil
  summer_ventilation:
    id: sommerlueftung
    name: "Sommerlüftung aktiv"
    state_topic: kwl/binary_sensor/sommerlueftung_aktiv/state
  exhaust_fan:
    name: "Fortluftventilator"
  # t_som. Nur nach Anmeldung des Bedienteils am Bus bekannt (im Flash gehalten)
  summer_threshold:
    id: t_som
    name: "Sommerlüftung Schwelle"
    state_topic: kwl/sensor/sommerlueftung_schwelle/state
  summer_min_outside:
    name: "Sommerlüftung Min. Außenluft"
    state_topic: kwl/sensor/sommerlueftung_min_aussenluft/state
  # Diagnose: Status-Byte von Gerät 08 (Bit 3 Fortluftventilator, Bit 5 Sommerlüftung)
  status_1a:
    name: "Status 0x1A"
  # Nur nach Anmeldung des Bedienteils am Bus bekannt (z.B. nach Stromausfall)
  last_message:
    name: "Letzte Meldung"
  bus_version:
    name: "BUS-Version"
  sw_master:
    name: "SW Master"
  sw_slave:
    name: "SW Slave"
  sw_tft:
    name: "SW Bedienteil"
  # Diagnose: Objekt 0x44, Bedeutung unbekannt (keine Drehzahl)
  fan_level_raw:
    name: "Rohwert 0x44"
  # Nur im Komplett-Abzug: Hysterese H_som und Haken "Sommerlüftung aktiv" im Bedienteil
  summer_hysteresis:
    name: "Sommerlüftung Hysterese"
    state_topic: kwl/sensor/sommerlueftung_hysterese/state
  summer_enabled:
    id: sommer_frei
    name: "Sommerlüftung freigegeben"
    state_topic: kwl/binary_sensor/sommerlueftung_freigegeben/state
  # 0 = keine Störung
  error_code:
    name: "Fehlercode"
  # Nur im Komplett-Abzug oder bei Änderung am Bedienteil
  stage_1_percent:
    id: stufe1_leistung
    name: "Stufe 1 Leistung"
  stage_2_percent:
    name: "Stufe 2 Leistung"
  stage_3_percent:
    id: stufe3_leistung
    name: "Stufe 3 Leistung"
  boost_duration:
    id: dauer_stoss
    name: "Dauer Stoßlüftung"
    state_topic: kwl/sensor/dauer_stosslueftung/state
  away_interval:
    name: "Laufzeit pro Stunde bei Abwesend"
  debalance_stage_1:
    name: "Disbalance Stufe 1"
  debalance_stage_2:
    name: "Disbalance Stufe 2"
  debalance_stage_3:
    name: "Disbalance Stufe 3"
  # Reihenfolge vermutet (Anleitung: eco, sicher, Feuchte-WT)
  frost_threshold_1:
    name: "Frostschutz-Schwelle eco"
  frost_threshold_2:
    name: "Frostschutz-Schwelle sicher"
  frost_threshold_3:
    name: "Frostschutz-Schwelle Feuchte-WT"
  # Wochenprogramm, nur im Komplett-Abzug oder bei Änderung am Bedienteil
  schedule_monday:
    id: wp_montag
    name: "Wochenprogramm Montag"
  schedule_tuesday:
    id: wp_dienstag
    name: "Wochenprogramm Dienstag"
  schedule_wednesday:
    id: wp_mittwoch
    name: "Wochenprogramm Mittwoch"
  schedule_thursday:
    id: wp_donnerstag
    name: "Wochenprogramm Donnerstag"
  schedule_friday:
    id: wp_freitag
    name: "Wochenprogramm Freitag"
  schedule_saturday:
    id: wp_samstag
    name: "Wochenprogramm Samstag"
  schedule_sunday:
    id: wp_sonntag
    name: "Wochenprogramm Sonntag"

sensor:
  # Wärmerückgewinnung (Zuluftseite). Während der Sommerlüftung ohne Bedeutung,
  # bei kleinem Abstand Abluft/Außenluft zu ungenau.
  - platform: template
    name: "Wärmerückgewinnungsgrad"
    state_topic: kwl/sensor/waermerueckgewinnungsgrad/state
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    icon: mdi:heat-wave
    update_interval: 60s
    lambda: |-
      const float zu = id(t_zuluft).state;
      const float au = id(t_aussenluft).state;
      const float ab = id(t_abluft).state;
      if (std::isnan(zu) || std::isnan(au) || std::isnan(ab) || id(sommerlueftung).state)
        return NAN;
      if (ab - au < 3.0f)
        return NAN;
      return (zu - au) / (ab - au) * 100.0f;

  # Abweichung der Uhr der Anlage von der NTP-Zeit (positiv = Anlage geht vor)
  - platform: template
    name: "Uhr der Anlage Abweichung"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    icon: mdi:clock-alert-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      const int32_t dev = id(kwl_bus).panel_clock_deviation(id(sntp_time).now());
      if (dev == INT32_MAX)
        return NAN;
      return dev;

# Not-Aus für das Senden: standardmäßig an, Zustand bleibt über Neustarts erhalten.
# Ausschalten stoppt jedes Senden sofort (auch vorgemerkte Frames und Wiederholungen).
switch:
  - platform: template
    name: "Senden aktiv"
    icon: mdi:send-lock
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(kwl_bus).set_write_enabled(true);
    turn_off_action:
      - lambda: id(kwl_bus).set_write_enabled(false);

  # Sommerlüftung freigeben/sperren (0x1B Bit 7, übrige Bits bleiben). Zeigt den Wert vom Bus, sendet nur
  # beim Schalten, beim Start nie (restore_mode DISABLED). Übernahme erst nach Quittung des Lüftergeräts.
  - platform: template
    name: "Sommerlüftung freigeben"
    state_topic: kwl/switch/sommerlueftung_freigeben/state
    command_topic: kwl/switch/sommerlueftung_freigeben/command
    icon: mdi:weather-sunny
    restore_mode: DISABLED
    lambda: |-
      if (!id(sommer_frei).has_state())
        return {};
      return id(sommer_frei).state;
    turn_on_action:
      - lambda: id(kwl_bus).send_summer_enabled(true);
    turn_off_action:
      - lambda: id(kwl_bus).send_summer_enabled(false);

# Anlage ein-/ausschalten wie am Bedienteil. Bewusst Knöpfe statt Schalter: ein Schalter könnte beim
# Neustart des ESP seinen Zustand wiederherstellen und dabei senden. Zustand zeigt "Anlage an".
# Bestätigt, wenn 0x08 den Wert meldet oder der Master 0x07 wiederholt (bis 20 s), keine
# Wiederholung: "ein" löst beim Master eine Neuanmeldung aller Geräte und einen Komplett-Abzug aus.
# Hinweis: Nach "Anlage einschalten" läuft die Anlage normal, das Display des Bedienteils bleibt
# aber dunkel, bis man es antippt (am Bus ist der Ablauf identisch mit Einschalten am Bedienteil).
button:
  - platform: template
    name: "Anlage einschalten"
    icon: mdi:power-plug
    on_press:
      - lambda: id(kwl_bus).send_system_power(true);
  - platform: template
    name: "Anlage ausschalten"
    icon: mdi:power-plug-off
    on_press:
      - lambda: id(kwl_bus).send_system_power(false);

  # Datum und Uhrzeit der Anlage auf die NTP-Zeit stellen (zwei Frames: 0x01 Datum, 0x02 Uhrzeit)
  - platform: template
    name: "Uhr der Anlage stellen"
    icon: mdi:clock-edit-outline
    on_press:
      - lambda: id(kwl_bus).send_clock(id(sntp_time).now());

# NTP-Zeit. Täglich um 03:30 die Uhr der Anlage stellen, wenn sie mehr als 60 s abweicht
# (auch nach der Zeitumstellung).
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time:
      - seconds: 0
        minutes: 30
        hours: 3
        then:
          - lambda: |-
              const ESPTime now = id(sntp_time).now();
              const int32_t dev = id(kwl_bus).panel_clock_deviation(now);
              if (dev != INT32_MAX && std::abs(dev) > 60)
                id(kwl_bus).send_clock(now);
