sensor:
  # Wärmerückgewinnung (Zuluftseite). Während der Sommerlüftung ohne Bedeutung,
  # bei kleinem Abstand Abluft/Außenluft zu ungenau.
  - platform: template
    name: "Wärmerückgewinnungsgrad"
    web_server:
      sorting_group_id: grp_temperaturen
      sorting_weight: 50
    state_topic: kwl/sensor/waermerueckgewinnungsgrad/state
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    icon: mdi:heat-wave
    update_interval: 60s
    lambda: |-
      const float zu = id(t_zuluft).state;
      const float au = id(t_aussenluft).state;
      const float ab = id(t_abluft).state;
      if (std::isnan(zu) || std::isnan(au) || std::isnan(ab) || id(sommerlueftung).state)
        return NAN;
      if (ab - au < 3.0f)
        return NAN;
      return (zu - au) / (ab - au) * 100.0f;

  # Abweichung der Uhr der Anlage von der NTP-Zeit (positiv = Anlage geht vor)
  - platform: template
    name: "Uhr der Anlage Abweichung"
    web_server:
      sorting_group_id: grp_uhr
      sorting_weight: 20
    unit_of_measurement: "s"
    accuracy_decimals: 0
    icon: mdi:clock-alert-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      const int32_t dev = id(kwl_bus).panel_clock_deviation(id(sntp_time).now());
      if (dev == INT32_MAX)
        return NAN;
      return dev;

# Not-Aus für das Senden: standardmäßig an, Zustand bleibt über Neustarts erhalten.
# Ausschalten stoppt jedes Senden sofort (auch vorgemerkte Frames und Wiederholungen).
switch:
  - platform: template
    name: "Senden aktiv"
    web_server:
      sorting_group_id: grp_betrieb
      sorting_weight: 70
    icon: mdi:send-lock
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(kwl_bus).set_write_enabled(true);
    turn_off_action:
      - lambda: id(kwl_bus).set_write_enabled(false);

  # Sommerlüftung freigeben/sperren (0x1B Bit 7, übrige Bits bleiben). Zeigt den Wert vom Bus, sendet nur
  # beim Schalten, beim Start nie (restore_mode DISABLED). Übernahme erst nach Quittung des Lüftergeräts.
  - platform: template
    name: "Sommerlüftung freigeben"
    web_server:
      sorting_group_id: grp_sommer
      sorting_weight: 30
    state_topic: kwl/switch/sommerlueftung_freigeben/state
    command_topic: kwl/switch/sommerlueftung_freigeben/command
    icon: mdi:weather-sunny
    restore_mode: DISABLED
    lambda: |-
      if (!id(sommer_frei).has_state())
        return {};
      return id(sommer_frei).state;
    turn_on_action:
      - lambda: id(kwl_bus).send_summer_enabled(true);
    turn_off_action:
      - lambda: id(kwl_bus).send_summer_enabled(false);

# Anlage ein-/ausschalten wie am Bedienteil. Bewusst Knöpfe statt Schalter: ein Schalter könnte beim
# Neustart des ESP seinen Zustand wiederherstellen und dabei senden. Zustand zeigt "Anlage an".
# Bestätigt, wenn 0x08 den Wert meldet oder der Master 0x07 wiederholt (bis 20 s), keine
# Wiederholung: "ein" löst beim Master eine Neuanmeldung aller Geräte und einen Komplett-Abzug aus.
# Hinweis: Nach "Anlage einschalten" läuft die Anlage normal, das Display des Bedienteils bleibt
# aber dunkel, bis man es antippt (am Bus ist der Ablauf identisch mit Einschalten am Bedienteil).
button:
  - platform: template
    name: "Anlage einschalten"
    web_server:
      sorting_group_id: grp_betrieb
      sorting_weight: 50
    icon: mdi:power-plug
    on_press:
      - lambda: id(kwl_bus).send_system_power(true);
  - platform: template
    name: "Anlage ausschalten"
    web_server:
      sorting_group_id: grp_betrieb
      sorting_weight: 60
    icon: mdi:power-plug-off
    on_press:
      - lambda: id(kwl_bus).send_system_power(false);

  # Datum und Uhrzeit der Anlage auf die NTP-Zeit stellen (zwei Frames: 0x01 Datum, 0x02 Uhrzeit)
  - platform: template
    name: "Uhr der Anlage stellen"
    web_server:
      sorting_group_id: grp_uhr
      sorting_weight: 30
    icon: mdi:clock-edit-outline
    on_press:
      - lambda: id(kwl_bus).send_clock(id(sntp_time).now());

  # Filter-Reset nach dem Filterwechsel, wie am Bedienteil: setzt Filter-Intervall (0x3D) und
  # Restlaufzeit (0x3E) in einem Frame auf das aktuelle Intervall. Nur nach einem echten Wechsel drücken.
  - platform: template
    name: "Filter-Reset"
    web_server:
      sorting_group_id: grp_filter
      sorting_weight: 40
    icon: mdi:air-filter
    entity_category: config
    on_press:
      - lambda: id(kwl_bus).send_filter_reset();

  # Komplett-Abzug anfordern wie das Bedienteil am Ende der Anmeldung (01 01 83 00 an den Master),
  # einmal im Sendefenster. Der Master schickt alle Register, danach melden sich die Geräte neu.
  # ACHTUNG: Dabei geht der Lüfter etwa 13 s aus. Daher nur von Hand, z.B. wenn gespeicherte Werte
  # nicht mehr stimmen (geändert am Bedienteil, während der ESP aus war).
  - platform: template
    name: "Komplett-Abzug anfordern"
    web_server:
      sorting_group_id: grp_diagnose
      sorting_weight: 110
    icon: mdi:database-refresh
    entity_category: diagnostic
    on_press:
      - lambda: id(kwl_bus).request_full_dump();

# NTP-Zeit. Die Anlage stellt selbst nicht auf Sommer-/Winterzeit um. Jede Stunde um xx:30 prüfen
# und stellen, wenn die Uhr der Anlage mehr als 60 s abweicht (erfasst auch die Zeitumstellung und
# einen Stromausfall der Anlage). Die Prüfung selbst sendet nichts; gestellt wird nur, wenn gerade
# keine andere Anforderung läuft.
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time:
      - seconds: 0
        minutes: 30
        then:
          - lambda: id(kwl_bus).sync_clock_if_needed(id(sntp_time).now());

# Einmal nach dem Start des ESP prüfen, sobald NTP-Zeit und Uhr der Anlage bekannt sind
interval:
  - interval: 30s
    then:
      - lambda: |-
          static bool done = false;
          if (done)
            return;
          const ESPTime now = id(sntp_time).now();
          if (id(kwl_bus).panel_clock_deviation(now) == INT32_MAX)
            return;
          done = true;
          id(kwl_bus).sync_clock_if_needed(now);
