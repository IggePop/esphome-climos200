# Wochenprogramm setzen: je Tag oder als Gruppe Mo-Fr bzw. Sa-So (alle Tage der Gruppe gleich).
# Format wie in der Anzeige: "00:00 Stufe 1, 07:00 Stufe 2, 20:00 Stufe 1", Zeiten in Viertelstunden,
# erster Eintrag 00:00, Stufen "aus" und "Stufe 1".."Stufe 3". Ungültige Eingaben werden abgelehnt
# (Grund in "Senden Letzter Befehl"). Gesendet werden nur die Register der gewählten Tage, höchstens 6 je
# Frame wie vom Bedienteil (Mo-Fr 3 Frames, Sa-So 1, ein Tag 1), je Sendefenster eins (Mo-Fr ~20 s).
# Jedes Frame muss das Lüftergerät quittieren, sonst bis zu 8 Versuche je Frame.
# Die Gruppen zeigen den ersten Tag (Mo-Fr den Montag, Sa-So den Samstag). Tagesmaske: Bit 0 = Mo.
text:
  - platform: template
    name: "Wochenprogramm Mo-Fr setzen"
    web_server:
      sorting_group_id: grp_wochenprogramm
      sorting_weight: 80
    icon: mdi:calendar-edit
    mode: text
    max_length: 255
    update_interval: 5s
    lambda: |-
      if (!id(wp_montag).has_state())
        return {};
      return id(wp_montag).state;
    set_action:
      - lambda: id(kwl_bus).send_schedule(0x1F, x);
  - platform: template
    name: "Wochenprogramm Sa-So setzen"
    web_server:
      sorting_group_id: grp_wochenprogramm
