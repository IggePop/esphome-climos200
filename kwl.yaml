# ESPHome-Konfiguration für eine KWL Zehnder/Paul Climos (F) 200 am RS485-Bus des Bedienteils.
# Board: Olimex ESP32-PoE-ISO (Ethernet), Bus-Adapter: Waveshare RS485 mit automatischer
# Richtungsumschaltung. Protokoll und Verdrahtung: siehe README.md und docs/ im Repository.
#
# Benötigte Einträge in secrets.yaml (Vorlage: secrets.example.yaml):
#   ota_password, kwl_web_password, mqtt_broker, mqtt_username, mqtt_password
#   (api_encryption_key nur, wenn der api-Block unten für Home Assistant aktiviert wird)

esphome:
  name: kwl
  friendly_name: KWL

external_components:
  - source:
      type: local
      path: components
    components: [climos]

esp32:
  board: esp32-poe-iso
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf


logger:
  level: DEBUG
  initial_level: INFO

select:
  - platform: logger
    name: "Log-Level"
    web_server:
      sorting_group_id: grp_diagnose
      sorting_weight: 120

  # Betriebsart setzen. Zeigt die laufende Betriebsart (Objekt 0x28) und sendet bei Auswahl im
  # nächsten Fenster nach 01 FF 84 00 (bis ~9 s), nur wenn "Senden aktiv" an ist. Kein Senden
  # beim Start. Ergebnis im Sensor "Senden Letzter Befehl" (bestätigt = 0x29 vom Lüftergerät oder
  # 0x28 vom Bedienteil mit dem neuen Code innerhalb 3 s, sonst bis zu 2 Wiederholungen).
  # Reihenfolge = Code 1..6, Namen wie im Sensor "Betriebsart".
  - platform: template
    name: "Betriebsart setzen"
    web_server:
      sorting_group_id: grp_betrieb
      sorting_weight: 10
    icon: mdi:fan
    update_interval: 1s
    options:
      - "Stufe 1"
      - "Stufe 2"
      - "Stufe 3"
      - "Stoßlüftung"
      - "Abwesend"
      - "Automatik"
    lambda: |-
      if (!id(betriebsart).has_state())
        return {};
      const std::string &s = id(betriebsart).state;
      if (s.rfind("Code", 0) == 0)
        return {};
      return s;
    set_action:
      - lambda: |-
          static const char *const NAMES[] = {"Stufe 1", "Stufe 2", "Stufe 3", "Stoßlüftung", "Abwesend", "Automatik"};
          for (uint8_t i = 0; i < 6; i++) {
            if (x == NAMES[i]) {
              id(kwl_bus).send_operating_mode(i + 1);
              return;
            }
          }

  # Frostschutz-Art (0x7B) wie am Bedienteil, Übernahme erst nach Quittung des Lüftergeräts
  - platform: template
    name: "Frostschutz-Art setzen"
    web_server:
      sorting_group_id: grp_frost
      sorting_weight: 20
    icon: mdi:snowflake-thermometer
    update_interval: 5s
    options:
      - "eco"
      - "sicher"
      - "Feuchte-WT"
    lambda: |-
      if (!id(frostschutz_art).has_state())
        return {};
      const std::string &s = id(frostschutz_art).state;
      if (s.rfind("Code", 0) == 0)
        return {};
      return s;
    set_action:
      - lambda: |-
          static const char *const NAMES[] = {"eco", "sicher", "Feuchte-WT"};
          for (uint8_t i = 0; i < 3; i++) {
            if (x == NAMES[i]) {
              id(kwl_bus).send_frost_mode(i);
              return;
            }
          }

  # Laufzeit pro Stunde bei Abwesend (0x3C): Stufe 1 läuft 15, 30 oder 45 min je Stunde, wie am
  # Bedienteil. Übernahme erst nach Quittung des Lüftergeräts.
  - platform: template
    name: "Laufzeit Abwesend setzen"
    web_server:
      sorting_group_id: grp_einstellungen
      sorting_weight: 90
    icon: mdi:timer-sand
    update_interval: 5s
    options:
      - "15 min"
      - "30 min"
      - "45 min"
    lambda: |-
      const float v = id(abwesend_laufzeit).state;
      if (v == 15) return std::string("15 min");
      if (v == 30) return std::string("30 min");
      if (v == 45) return std::string("45 min");
      return {};
    set_action:
      - lambda: id(kwl_bus).send_away_interval(atoi(x.c_str()));

  # Einstellwerte als Auswahllisten (Werte in der Einheit der Anzeige, z.B. "25.5" für 25,5 °C).
  # Zeigen den Wert vom Bus, senden nur bei Auswahl. Kein Gerät meldet Einstellwerte zurück. Ergebnis in
  # "Senden Letzter Befehl": "angenommen (Lüftergerät)" = das Lüftergerät hat den Empfang quittiert (86/87),
  # erst dann übernimmt der Sensor den Wert. Über MQTT den Wert als Text senden, z.B. "25.5".
  - platform: template
    name: "Sommerlüftung Schwelle setzen"
    web_server:
      sorting_group_id: grp_sommer
      sorting_weight: 50
    state_topic: kwl/select/sommerlueftung_schwelle_setzen/state
    command_topic: kwl/select/sommerlueftung_schwelle_setzen/command
    icon: mdi:thermometer-chevron-up
    update_interval: 5s
    # Auswahl in °C
    options: [
      "20.0", "20.5", "21.0", "21.5", "22.0", "22.5", "23.0", "23.5", "24.0", "24.5", "25.0", "25.5",
      "26.0", "26.5", "27.0", "27.5", "28.0", "28.5", "29.0", "29.5", "30.0"
    ]
    lambda: |-
      const float v = id(t_som).state;
      if (std::isnan(v))
        return {};
      char buf[12];
      std::snprintf(buf, sizeof(buf), "%.1f", v);
      return std::string(buf);
    set_action:
      - lambda: id(kwl_bus).send_summer_threshold(atof(x.c_str()));

  - platform: template
    name: "Sommerlüftung Hysterese setzen"
    web_server:
